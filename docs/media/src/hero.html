<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><style>
.canvas { height: 560px; display: grid; grid-template-columns: 520px 1fr; gap: 24px; align-items: center; }
h1 { font-size: 104px; margin: 18px 0 14px; }
h1 span { display: inline-block; background: var(--orange); padding: 0 14px 6px; border: var(--b); border-radius: 12px; box-shadow: var(--sh-lg); transform: rotate(-2deg); margin-left: -4px; }
.tag { font-size: 25px; line-height: 1.35; font-weight: 600; max-width: 470px; }
.keys { display: flex; gap: 10px; margin-top: 30px; flex-wrap: wrap; }
.stack { position: relative; height: 470px; }
.win { position: absolute; width: 470px; overflow: hidden; }
.win .bar { height: 30px; display: flex; gap: 7px; align-items: center; padding: 0 12px; border-bottom: var(--b); background: var(--soft); font: 600 13px var(--sans); }
.win .bar i { width: 11px; height: 11px; border-radius: 50%; border: 2px solid #000; background: var(--card); }
.win .bar i:first-child { background: var(--red); } .win .bar i:nth-child(2) { background: var(--yellow); } .win .bar i:nth-child(3) { background: var(--mint); }
.win .bar b { margin-left: 8px; font-weight: 600; color: var(--muted); }
.win img { display: block; width: 100%; }
.w1 { left: 0; top: 0; transform: rotate(-3deg); }
.w2 { right: 0; bottom: 0; transform: rotate(2.5deg); }
.sticker { position: absolute; z-index: 3; font-family: var(--head); font-size: 20px; padding: 8px 14px; border: var(--b); border-radius: 8px; box-shadow: var(--sh); }
.s1 { left: 268px; top: 214px; background: var(--mint); transform: rotate(-6deg); }
.s2 { right: 10px; top: 40px; background: var(--lilac); transform: rotate(5deg); }
</style></head><body>
<div class="canvas">
  <div>
    <span class="eyebrow">Offline HTML presentations</span>
    <h1><span>deck-kit</span></h1>
    <p class="tag">Write slides as HTML. Present with a synced presenter view. Ship one file that runs with the network off.</p>
    <div class="keys"><span class="key">P</span><span class="key">O</span><span class="key">B</span><span class="key">F</span><span class="key">?</span><span class="key">PgDn</span></div>
  </div>
  <div class="stack">
    <div class="win card w1"><div class="bar"><i></i><i></i><i></i><b>Audience</b></div><img src="../deck-build.png" alt=""></div>
    <div class="win card w2"><div class="bar"><i></i><i></i><i></i><b>Presenter</b></div><img src="../presenter.png" alt=""></div>
    <span class="sticker s1">in sync</span>
    <span class="sticker s2">no network</span>
  </div>
</div></body></html>
